# Mantiene activo el proyecto de Supabase (plan gratis lo pausa tras ~7 días sin uso).
# Hace una lectura pequeña de la tabla de reservas lunes y jueves.
# Requiere los secrets SUPABASE_URL y SUPABASE_ANON_KEY en el repo.
name: Supabase keep-alive

on:
  schedule:
    - cron: '0 15 * * 1,4' # lunes y jueves, 15:00 UTC
  workflow_dispatch: # permite correrlo a mano desde la pestaña Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Faltan los secrets SUPABASE_URL / SUPABASE_ANON_KEY" >&2
            exit 1
          fi
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/reservations?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          echo "Supabase respondió: $status"
          [ "$status" = "200" ]
